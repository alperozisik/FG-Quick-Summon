name: Publish Quick Summon

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build release
        run: python3 build_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Quick Summon $GITHUB_REF_NAME" \
            release/QuickSummon.ext release/Spiritual_Weapon.png release/SHA256SUMS.txt
